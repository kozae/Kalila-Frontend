[package]
name = "facsimile-cropper"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]


[dependencies]
wasm-bindgen = "0.2.80"
base64 = "0.13.0"
console_error_panic_hook = "0.1.7"

[dependencies.image]
version = "0.24.2"
default-features = false
features = ["gif", "jpeg", "ico", "png", "pnm", "tga", "tiff", "webp", "bmp", "hdr", "dxt", "dds", "farbfeld"]

[dependencies.imageproc]
version = "0.23.0"
default-features = false
